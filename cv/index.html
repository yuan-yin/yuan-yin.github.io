    .cv-stage-wrap {
      position: relative;
    }

    /* Sticky anchor: at rest the toolbar sits above the PDF with breathing
       room; once pinned below the navbar it floats over the scrolling CV. */
    .cv-toolbar-anchor {
      position: sticky;
      top: var(--cv-toolbar-top, 57px);
      z-index: 10;
      line-height: normal;
    }

    /* iOS-style progressive header blur: one glass sheet spanning from the
       viewport top (behind the navbar) down through the pinned language
       controls, built from two stacked backdrop-filter layers each faded
       out downward with a gradient mask. The sheet stays at full strength
       until the toolbar's bottom edge (calc(100% - 5.5rem), since it
       extends 5.5rem past the anchor) and melts into the CV below it. */
    .cv-toolbar-backdrop {
      position: absolute;
      top: calc(-1 * var(--cv-toolbar-top, 57px));
      bottom: -9rem;
      left: calc(50% - 50vw);
      right: calc(50% - 50vw);
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        color-mix(in srgb, var(--global-bg-color) 72%, transparent),
        color-mix(in srgb, var(--global-bg-color) 42%, transparent) calc(100% - 9rem),
        transparent calc(100% - 1.5rem)
      );
      /* The sheet itself is the lightest blur stage; its mask also caps the
         heavier pseudo layers, whose own ramps end higher up. Blur strength
         steps down 16 -> 8 -> 3 -> 0 through overlapping fades over the
         9rem tail, so the melt has no sharp end. */
      -webkit-backdrop-filter: blur(3px);
      backdrop-filter: blur(3px);
      -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 4rem), transparent 100%);
      mask-image: linear-gradient(to bottom, black calc(100% - 4rem), transparent 100%);
      opacity: 0;
      visibility: hidden;
      transition:
        opacity 280ms ease,
        visibility 0s linear 280ms;
    }

    .cv-toolbar-backdrop::before,
    .cv-toolbar-backdrop::after {
      content: '';
      position: absolute;
      inset: 0;
    }

    .cv-toolbar-backdrop::before {
      -webkit-backdrop-filter: blur(14px) saturate(1.3);
      backdrop-filter: blur(14px) saturate(1.3);
      -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 9rem), transparent calc(100% - 5rem));
      mask-image: linear-gradient(to bottom, black calc(100% - 9rem), transparent calc(100% - 5rem));
    }

    .cv-toolbar-backdrop::after {
      -webkit-backdrop-filter: blur(7px);
      backdrop-filter: blur(7px);
      -webkit-mask-image: linear-gradient(to bottom, black calc(100% - 7rem), transparent calc(100% - 2.5rem));
      mask-image: linear-gradient(to bottom, black calc(100% - 7rem), transparent calc(100% - 2.5rem));
    }

    @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      .cv-toolbar-backdrop {
        background: linear-gradient(to bottom, var(--global-bg-color) calc(100% - 9rem), transparent);
      }
    }

    /* While the sheet is up it covers the navbar region too, so the
       navbar's own blur layers switch off — stacking the two systems is
       what produced the banding artifacts. Before the toolbar pins, the
       navbar keeps its site-wide glass so the page heading still melts
       under it; the swap happens with only whitespace behind the bar. */
    html.cv-glass-extended #navbar::before,
    html.cv-glass-extended #navbar::after {
      content: none;
    }

    .header-toolbar {
      position: relative;
      display: flex;
      flex-direction: row;
      flex-wrap: wrap;
      gap: 0.5rem 1rem;
      align-items: center;
      justify-content: center;
      width: fit-content;
      max-width: calc(100% - 1.5rem);
      margin: 0.35rem auto 0.85rem;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-4px);
      transition:
        opacity 160ms ease,
        transform 160ms ease,
        visibility 0s linear 160ms;
    }

    .cv-controls-ready .header-toolbar,
    .cv-error .header-toolbar {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition:
        opacity 240ms ease,
        transform 240ms ease;
    }

    .cv-toolbar-stuck.cv-controls-ready .cv-toolbar-backdrop,
    .cv-toolbar-stuck.cv-error .cv-toolbar-backdrop {
      opacity: 1;
      visibility: visible;
      transition: opacity 240ms ease;
    }

    .pdf-stage {
      position: relative;
      width: 100%;
      max-width: 100%;
      /* A4 (210 x 297 mm) — matches the source PDFs. The stage clips overflow,
         so a shorter ratio here crops the bottom of every rendered page. */
      min-height: min(720px, calc((100vw - 2rem) * 1.4142));
      aspect-ratio: 210 / 297;
      background:
        linear-gradient(90deg, transparent 0, rgba(150, 120, 182, 0.08) 50%, transparent 100%),
        linear-gradient(var(--global-bg-color), var(--global-bg-color)), var(--global-card-bg-color);
      background-size:
        240% 100%,
        calc(100% - 4rem) calc(100% - 4rem),
        auto;
      background-position:
        120% 0,
        2rem 2rem,
        0 0;
      background-repeat: no-repeat;
      border: 1px solid var(--global-divider-color);
      border-radius: 2px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
      /* Side sheets overhang the stage into the page gutters */
      overflow: visible;
      line-height: 0;
      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        box-shadow 180ms ease;
    }

    .cv-loading .pdf-stage {
      animation: pdf-loading-sheen 1.4s ease-in-out infinite;
    }

    @keyframes pdf-loading-sheen {
      0% {
        background-position:
          120% 0,
          2rem 2rem,
          0 0;
      }
      100% {
        background-position:
          -120% 0,
          2rem 2rem,
          0 0;
      }
    }

    /* Keep the overhanging sheets from causing horizontal page scroll.
       (clip, not hidden: hidden would break the sticky toolbar) */
    body {
      overflow-x: clip;
    }

    /* Page deck: the current page fills the stage exactly as before; the
       neighbor pages are full-size sheets stacked BEHIND it, sticking out
       into the side gutters. Clicking one brings it to the center. */
    .pdf-page {
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      line-height: 0;
    }

    .pdf-page--current {
      position: relative;
      z-index: 1;
    }

    /* Side sheets are fixed-width windows in the gutters, flush against the
       stage edges, clipping a full-size render of their page. Like pages in
       a row: the left window shows the previous page's RIGHT edge, the right
       window shows the next page's LEFT edge. */
    .pdf-page--prev,
    .pdf-page--next {
      position: absolute;
      /* No top:50% + translateY: an ancestor transform shifts the painted
         position of the sticky chevron, desyncing it from the loop-back
         icon. Same geometry as .pdf-restart instead. */
      top: 0;
      height: 100%;
      /* Fill the whole gutter: from the stage edge to the screen edge
         (minus a small breathing gap), so nothing gets clipped. */
      width: calc(50vw - 50% - 0.75rem);
      /* clip, not hidden: hidden would make this a scroll container and
         break the sticky chevron (it would stick to the zone, not the
         viewport like the loop-back icon does) */
      overflow: clip;
      z-index: 0;
      display: flex;
      align-items: center;
      cursor: pointer;
      border: 1px solid var(--global-divider-color);
      border-radius: 2px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
      transition: border-color 180ms ease;
    }

    .pdf-page--prev canvas,
    .pdf-page--next canvas {
      flex: 0 0 auto;
    }

    .pdf-page--prev {
      right: 100%;
      justify-content: flex-end;
    }

    .pdf-page--next {
      left: 100%;
      justify-content: flex-start;
    }

    .pdf-page--prev:hover,
    .pdf-page--prev:focus-visible,
    .pdf-page--next:hover,
    .pdf-page--next:focus-visible {
      border-color: var(--global-theme-color);
    }

    .pdf-page.is-empty {
      visibility: hidden;
      pointer-events: none;
    }

    /* Navigation hint over the side windows: a thin color layer above the
       PDF with a chevron floating at the same position as the loop-back
       icon. Hover marks the zone active in the theme color rather than
       highlighting the page content. */
    .pdf-page__hint {
      position: absolute;
      inset: 0;
      z-index: 2;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      pointer-events: none;
      background: color-mix(in srgb, var(--global-theme-color) 4%, transparent);
      color: var(--global-text-color-light);
      font-size: 1.5rem;
      transition:
        background 180ms ease,
        color 180ms ease;
    }

    /* All three zone icons (prev / next / loop-back) sit on a circular
       liquid-glass pill: near-clear saturated backdrop + specular rim,
       floating at mid-viewport like before. */
    .pdf-page__hint i,
    .pdf-restart i {
      position: sticky;
      top: calc(50vh - 1.4rem);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.8rem;
      height: 2.8rem;
      margin: 0.9rem 0;
      border-radius: 999px;
      background: color-mix(in srgb, #ffffff 7%, transparent);
      box-shadow:
        0 0.35rem 1.3rem rgba(39, 48, 74, 0.14),
        inset 0 0 0 1px rgba(255, 255, 255, 0.3),
        inset 0.14rem 0.22rem 0.4rem -0.15rem rgba(255, 255, 255, 0.95),
        inset -0.12rem -0.2rem 0.35rem -0.15rem rgba(255, 255, 255, 0.7),
        inset 0 0 0.65rem 0.05rem rgba(255, 255, 255, 0.16);
      -webkit-backdrop-filter: blur(7px) saturate(1.6) brightness(1.04);
      backdrop-filter: blur(7px) saturate(1.6) brightness(1.04);
      font-size: 1.1rem;
    }

    html[data-theme='dark'] .pdf-page__hint i,

      background: rgba(16, 19, 26, 0.42);
      box-shadow:

        inset 0.14rem 0.22rem 0.4rem -0.15rem rgba(255, 255, 255, 0.5),
        inset -0.12rem -0.2rem 0.35rem -0.15rem rgba(255, 255, 255, 0.26),
        inset 0 0 0.65rem 0.05rem rgba(255, 255, 255, 0.07);
      -webkit-backdrop-filter: blur(7px) saturate(1.4) brightness(0.82);
      backdrop-filter: blur(7px) saturate(1.4) brightness(0.82);
    }

    .pdf-page__hint i::before {
      color: inherit;
    }

    /* Only the main stage page is sharp; side pages are frosted and
       semi-transparent so they recede into the page background */
    .pdf-page--prev canvas,
    .pdf-page--next canvas {
      filter: blur(4px);
    }

    /* Overrides the .is-rendered fade-in target (opacity: 1) */

    .pdf-page--next canvas.is-rendered {
      opacity: 0.25;

    .pdf-page--prev:hover .pdf-page__hint,
    .pdf-page--prev:focus-visible .pdf-page__hint,
    .pdf-page--next:hover .pdf-page__hint,
    .pdf-page--next:focus-visible .pdf-page__hint {
      background: color-mix(in srgb, var(--global-theme-color) 10%, transparent);
      color: var(--global-theme-color);
    }

    /* Loop-back button: takes the next-page zone on the last page,
       deliberately without page content — just the affordance. */
    .pdf-restart {
      position: absolute;
      top: 0;
      left: 100%;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      width: calc(50vw - 50% - 0.75rem);
      height: 100%;
      margin: 0;
      padding: 0;
      border: 1px dashed var(--global-divider-color);
      border-radius: 2px;
      background: color-mix(in srgb, var(--global-theme-color) 4%, transparent);
      color: var(--global-text-color-light);
      font-size: 1.5rem;
      cursor: pointer;
      opacity: 0.7;
      transition:
        opacity 180ms ease,
        color 180ms ease,
        border-color 180ms ease,
        background 180ms ease;
    }

    .pdf-restart i,
    .pdf-restart i::before {
      color: inherit;
    }

    .pdf-restart:hover,
    .pdf-restart:focus-visible {
      opacity: 1;
      border-color: var(--global-theme-color);
      background: color-mix(in srgb, var(--global-theme-color) 9%, transparent);
      color: var(--global-theme-color);
    }

    .pdf-restart[hidden] {
      display: none;
    }

    /* Mobile pager: hidden on desktop where the side zones handle paging */
    .pager-mobile {
      display: none;
      gap: 0.5rem;
      align-items: center;
      justify-content: center;
      width: 100%;
      order: 3;
    }

    .pager-mobile__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 2.1rem;
      height: 2.1rem;
      padding: 0;
      border: 1px solid color-mix(in srgb, var(--global-theme-color) 42%, var(--global-divider-color));
      border-radius: 999px;
      background: color-mix(in srgb, var(--global-theme-color) 7%, transparent);
      color: var(--global-text-color);
      cursor: pointer;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        color 160ms ease,
        opacity 160ms ease;
    }

    .pager-mobile__btn i,
    .pager-mobile__btn i::before {
      color: inherit;
    }

    .pager-mobile__btn:not(:disabled):hover,
    .pager-mobile__btn:not(:disabled):focus-visible {
      border-color: var(--global-theme-color);
      background: var(--global-theme-color);
      color: #ffffff;
    }

    .pager-mobile__btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    html[data-theme='dark'] .pager-mobile__btn:not(:hover):not(:disabled) {
      background: color-mix(in srgb, var(--global-theme-color) 12%, transparent);
    }

    /* The center page needs its own shadow to visually sit on top of the deck */
    .pdf-page--current canvas {
      box-shadow: 0 6px 26px rgba(0, 0, 0, 0.16);
    }

    .pdf-page canvas {
      display: block;
      width: 100%;
      height: auto;
      opacity: 0;
      /* --enter-x is set by JS on page navigation so the incoming page
         slides in from the side it came from */
      transform: translate(var(--enter-x, 0px), var(--enter-y, 6px));
      transition:
        opacity 220ms ease,
        transform 220ms ease;
    } /* avoid inline baseline gap */

    .pdf-page canvas.is-rendered {
      opacity: 1;
      transform: translate(0, 0);
    }

    .pdf-page--current canvas.is-updating {
      opacity: 0.92;
      transition:
        opacity 120ms ease,
        transform 120ms ease;
    }

    /* Ghost: a snapshot of the outgoing page that slides away while the
       real canvas (already reset off to the side) slides in with the new
       page — both animate at the same time. */
    .pdf-ghost {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
      pointer-events: none;
      opacity: 1;
      transform: translate(0, 0);
      transition:
        opacity 260ms ease,
        transform 260ms ease;
    }

    .pdf-ghost.is-leaving {
      opacity: 0;
      transform: translate(var(--exit-x, 0px), 0);
    }

    .pdf-loading,
    .pdf-error {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--global-text-color-light);
      font-size: 0.95rem;
      line-height: 1.4;
      opacity: 0.78;
      pointer-events: none;
      z-index: 1;
      transition: opacity 160ms ease;
    }

    .pdf-error,
    .cv-ready .pdf-error {
      display: none;
    }

    .cv-ready:not(.cv-loading) .pdf-loading {
      display: none;
    }

    .cv-error .pdf-loading {
      display: none;
    }

    .cv-error .pdf-error {
      display: flex;
    }

    .lang-toolbar {
      display: inline-flex;
      gap: 0.45rem;
      align-items: center;
      justify-content: center;
      order: 1;
      font-size: 1rem;
    }

    /* Segmented language control with a sliding thumb */
    .lang-segment {
      position: relative;
      display: inline-flex;
      align-items: center;
      padding: 0.22rem;
      border: 1px solid color-mix(in srgb, var(--global-theme-color) 42%, var(--global-divider-color));
      border-radius: 999px;
      background: color-mix(in srgb, var(--global-theme-color) 7%, transparent);
    }

    .lang-segment__thumb {
      position: absolute;
      top: 0.22rem;
      left: 0;
      height: calc(100% - 0.44rem);
      border-radius: 999px;
      background: var(--global-theme-color);
      box-shadow: 0 2px 8px color-mix(in srgb, var(--global-theme-color) 45%, transparent);

    }

      position: relative;
      z-index: 1;
      min-height: 1.95rem;
      padding: 0.42rem 0.85rem;
      border: 0;
      border-radius: 999px;
      background: transparent;
      color: var(--global-text-color);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1;
      cursor: pointer;
      user-select: none;
      transition: color 180ms ease;
    }

    .lang-segment__option[aria-checked='true'] {
      color: #ffffff;
      font-weight: 700;
    }

    .lang-segment__option:not([aria-checked='true']):hover {
      color: var(--global-theme-color);
    }

      align-items: center;
      align-self: stretch;

      padding: 0.5rem 0.9rem;
      border: 1px solid color-mix(in srgb, var(--global-theme-color) 42%, var(--global-divider-color));
      border-radius: 999px;
      background: color-mix(in srgb, var(--global-theme-color) 7%, transparent);
      color: var(--global-text-color);
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1;
      text-decoration: none;
      cursor: pointer;
      user-select: none;
      transition:
        background 160ms ease,
        border-color 160ms ease,
        color 160ms ease,
        transform 160ms ease;
    }

    .cv-download-btn span,
    .cv-download-btn i,
    .cv-download-btn i::before {
      color: currentColor;
      font-size: 0.9em;
    }

    .cv-download-btn:hover,
    .cv-download-btn:focus-visible {
      border-color: var(--global-theme-color);
      background: var(--global-theme-color);
      color: #ffffff;
      text-decoration: none;
      transform: translateY(-1px);
    }

    .cv-download-btn:hover span,
    .cv-download-btn:hover i,
    .cv-download-btn:hover i::before,
    .cv-download-btn:focus-visible span,
